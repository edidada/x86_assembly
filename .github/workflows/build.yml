name: Build x86 assembly (NASM)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install NASM
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm
          nasm -v

      - name: Assemble all .asm files
        run: |
          mkdir -p build
          status=0
          for f in $(find . -name '*.asm' -not -path './.github/*'); do
            base=$(basename "$f" .asm)
            out="build/${base}.bin"
            echo "::group::Assembling $f"
            if nasm -f bin -o "$out" "$f"; then
              echo "OK: $f -> $out ($(stat -c%s "$out") bytes)"
            else
              echo "FAIL: $f"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: Upload assembled binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assembled-binaries
          path: build/
