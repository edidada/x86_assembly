name: Build x86 assembly (NASM)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install NASM 3.01
        env:
          NASM_VER: "3.01"
        run: |
          set -euo pipefail
          BUILD_DIR="${RUNNER_TEMP:-/tmp}/nasm-build"
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"
          URL_NASM_US="https://www.nasm.us/pub/nasm/releasebuilds/${NASM_VER}/nasm-${NASM_VER}.tar.xz"
          URL_GH="https://github.com/nasm/nasm/releases/download/nasm-${NASM_VER}/nasm-${NASM_VER}.tar.gz"
          if curl -fsSL "$URL_NASM_US" -o nasm.tar.xz; then
            tar xf nasm.tar.xz
          else
            curl -fsSL "$URL_GH" -o nasm.tar.gz
            tar xzf nasm.tar.gz
          fi
          cd "nasm-${NASM_VER}"
          ./configure --prefix=/usr/local
          make -j"$(nproc)"
          sudo make install
          command -v nasm
          nasm -v

      - name: Assemble all .asm files
        run: |
          mkdir -p build
          status=0
          for f in $(find . -name '*.asm' -not -path './.github/*'); do
            base=$(basename "$f" .asm)
            out="build/${base}.bin"
            echo "::group::Assembling $f"
            if nasm -f bin -o "$out" "$f"; then
              echo "OK: $f -> $out ($(stat -c%s "$out") bytes)"
            else
              echo "FAIL: $f"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: Upload assembled binaries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: assembled-binaries
          path: build/
